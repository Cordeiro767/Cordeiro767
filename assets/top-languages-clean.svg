<svg width="780" height="205" viewBox="0 0 780 205" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Top Languages</title>
  <desc id="desc">Dark language card with Python highlighted.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="780" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="0.78" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .title { font-size: 24px; font-weight: 850; fill: #F0FCFF; letter-spacing: 0; }
      .sub { font-size: 13px; fill: #8B949E; letter-spacing: 0; }
      .python { font-size: 38px; font-weight: 950; fill: #67E8F9; letter-spacing: 0; }
      .label { font-size: 13px; fill: #C9D1D9; font-weight: 650; letter-spacing: 0; }
      .muted { font-size: 12px; fill: #8B949E; letter-spacing: 0; }
    </style>
  </defs>

  <rect x="1" y="1" width="778" height="203" rx="16" fill="url(#card)" stroke="#30363D" stroke-width="1.2"/>
  <text x="34" y="42" class="font title">Top Languages</text>
  <text x="34" y="66" class="font sub">Python em destaque, com base em projetos de automa&#231;&#227;o, dados e dashboards</text>

  <text x="34" y="122" class="font python">Python</text>
  <text x="176" y="120" class="font muted">principal linguagem de estudo e constru&#231;&#227;o</text>

  <rect x="34" y="142" width="672" height="16" rx="8" fill="#161B22"/>
  <rect x="34" y="142" width="492" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>
  <rect x="526" y="142" width="82" height="16" fill="#60A5FA"/>
  <rect x="608" y="142" width="50" height="16" fill="#C084FC"/>
  <rect x="658" y="142" width="48" height="16" rx="8" fill="#F472B6"/>

  <g transform="translate(34 176)">
    <circle cx="6" cy="6" r="5" fill="#22D3EE"/>
    <text x="18" y="10" class="font label">Python</text>
  </g>
  <g transform="translate(148 176)">
    <circle cx="6" cy="6" r="5" fill="#60A5FA"/>
    <text x="18" y="10" class="font label">JavaScript</text>
  </g>
  <g transform="translate(286 176)">
    <circle cx="6" cy="6" r="5" fill="#C084FC"/>
    <text x="18" y="10" class="font label">React</text>
  </g>
  <g transform="translate(390 176)">
    <circle cx="6" cy="6" r="5" fill="#F472B6"/>
    <text x="18" y="10" class="font label">Data / Dashboards</text>
  </g>
</svg>
