<svg width="780" height="310" viewBox="0 0 780 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Cordeiro | Python Developer &amp; Automation</title>
  <desc id="desc">Dark GitHub stats card focused on commits, streak, contributions and activity grade.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="780" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0A0F17"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .title { font-size: 25px; font-weight: 800; fill: #E5F9FF; letter-spacing: 0; }
      .bio { font-size: 13px; fill: #8B949E; letter-spacing: 0; }
      .label { font-size: 12px; fill: #8B949E; font-weight: 600; letter-spacing: 0; }
      .value { font-size: 38px; font-weight: 850; fill: url(#cyan); letter-spacing: 0; }
      .small { font-size: 12px; fill: #C9D1D9; letter-spacing: 0; }
      .grade { font-size: 54px; font-weight: 900; fill: #C084FC; letter-spacing: 0; }
    </style>
  </defs>

  <rect x="1" y="1" width="778" height="308" rx="14" fill="url(#card)" stroke="#30363D" stroke-width="1.2"/>
  <path d="M32 80H748" stroke="url(#line)" stroke-width="1.5"/>
  <path d="M32 252H748" stroke="#30363D" stroke-width="1"/>
  <g opacity="0.12" stroke="#22D3EE">
    <path d="M52 110H120V132H188"/>
    <path d="M612 42H694V64H736"/>
    <path d="M570 232H654V212H724"/>
    <circle cx="188" cy="132" r="3" fill="#22D3EE"/>
    <circle cx="736" cy="64" r="3" fill="#22D3EE"/>
    <circle cx="724" cy="212" r="3" fill="#22D3EE"/>
  </g>

  <text x="32" y="40" class="font title">Felipe Cordeiro | Python Developer &amp; Automation</text>
  <text x="32" y="63" class="font bio">Construindo bots, automa&#231;&#245;es e sistemas de monetiza&#231;&#227;o</text>

  <g transform="translate(34 108)">
    <rect width="166" height="112" rx="12" fill="#0B1220" stroke="#263241"/>
    <text x="18" y="34" class="font value">43</text>
    <text x="18" y="64" class="font label">Commits This Week</text>
    <text x="18" y="88" class="font small">foco em consist&#234;ncia</text>
  </g>

  <g transform="translate(218 108)">
    <rect width="166" height="112" rx="12" fill="#0B1220" stroke="#263241"/>
    <text x="18" y="34" class="font value">2</text>
    <text x="62" y="34" class="font small">days</text>
    <text x="18" y="64" class="font label">Current Streak</text>
    <text x="18" y="88" class="font small">atividade recente</text>
  </g>

  <g transform="translate(402 108)">
    <rect width="166" height="112" rx="12" fill="#0B1220" stroke="#263241"/>
    <text x="18" y="34" class="font value">44</text>
    <text x="18" y="64" class="font label">Contributions This Year</text>
    <text x="18" y="88" class="font small">aprendendo em p&#250;blico</text>
  </g>

  <g transform="translate(586 108)">
    <rect width="160" height="112" rx="12" fill="#0B1220" stroke="#263241"/>
    <circle cx="80" cy="43" r="31" fill="#151025" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
    <text x="62" y="61" class="font grade">B</text>
    <text x="31" y="91" class="font label">Activity Grade</text>
  </g>

  <g transform="translate(32 266)">
    <rect width="112" height="22" rx="11" fill="#111827" stroke="#263241"/>
    <circle cx="17" cy="11" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <text x="29" y="15" class="font small">Python focus</text>
  </g>
  <g transform="translate(156 266)">
    <rect width="142" height="22" rx="11" fill="#111827" stroke="#263241"/>
    <circle cx="17" cy="11" r="4" fill="#F472B6" filter="url(#glow)"/>
    <text x="29" y="15" class="font small">Automation builder</text>
  </g>
  <g transform="translate(310 266)">
    <rect width="128" height="22" rx="11" fill="#111827" stroke="#263241"/>
    <circle cx="17" cy="11" r="4" fill="#60A5FA" filter="url(#glow)"/>
    <text x="29" y="15" class="font small">Learning by doing</text>
  </g>
</svg>
