    <linearGradient id="lineFade" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9D9D9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#D9D9D9" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#D9D9D9" stop-opacity="0.25"/>
      <stop offset="0.82" stop-color="#D9D9D9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D9D9D9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#surface)"/>
