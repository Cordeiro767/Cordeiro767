    <text x="640" y="212" text-anchor="middle" fill="#D7F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="0.6">Python Developer | Automa&#231;&#227;o &amp; Bots | Projetos Reais</text>
