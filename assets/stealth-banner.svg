    <pattern id="technicalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#2A2A2A" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
