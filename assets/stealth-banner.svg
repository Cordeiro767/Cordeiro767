      <animate attributeName="stroke-dashoffset" from="0" to="-690" dur="6.6s" repeatCount="indefinite"/>
    </path>
    <path d="M80 292H268L326 244H450" stroke="url(#flow)" stroke-width="1.6" stroke-dasharray="120 520" opacity="0.54">
