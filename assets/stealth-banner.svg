<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Felipe Cordeiro stealth technology banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030303"/>
      <stop offset="0.45" stop-color="#101113"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="metal" x1="300" y1="0" x2="980" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B8F96"/>
      <stop offset="0.5" stop-color="#F3F4F6"/>
      <stop offset="1" stop-color="#6B7280"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#2A2C30" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <mask id="fade">
      <rect width="1280" height="360" fill="url(#fadeGradient)"/>
    </mask>
    <linearGradient id="fadeGradient" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.14" stop-color="white"/>
      <stop offset="0.86" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" stroke="#2A2C30" stroke-width="2"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <g opacity="0.34" stroke-linecap="round">
    <path d="M72 64H316M964 64H1208M112 296H392M888 296H1168" stroke="#74777F" stroke-width="1.2" stroke-dasharray="34 22">
      <animate attributeName="stroke-dashoffset" from="0" to="-224" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.48;0.18" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M52 128H250M1030 128H1228M48 226H284M996 226H1232" stroke="#3F3F46" stroke-width="1" stroke-dasharray="18 18">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M126 34V154M238 206V326M1038 34V160M1152 206V326" stroke="#74777F" stroke-width="1.2" stroke-dasharray="28 20">
      <animate attributeName="stroke-dashoffset" from="0" to="-192" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.16;0.44;0.16" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M188 44V118M306 244V318M974 42V122M1096 238V318" stroke="#3F3F46" stroke-width="1" stroke-dasharray="14 16">
      <animate attributeName="stroke-dashoffset" from="0" to="140" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.24" stroke="#A1A1AA" stroke-width="1" stroke-linecap="round">
    <path d="M0 180H220M1060 180H1280" stroke-dasharray="42 28">
      <animate attributeName="stroke-dashoffset" from="0" to="-280" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M640 0V72M640 288V360" stroke-dasharray="22 18">
      <animate attributeName="stroke-dashoffset" from="0" to="160" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M120 92H324L384 146H548L604 104H754L822 160H1120" stroke="#3B3D42" stroke-width="2" opacity="0.52" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 1400;120 1280;0 1400" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M168 260H344L420 210H574L642 250H820L892 206H1078" stroke="#60646C" stroke-width="1.6" opacity="0.42" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="10s" repeatCount="indefinite"/>
  </path>
  <g opacity="0.66">
    <circle cx="324" cy="92" r="4" fill="#A1A1AA">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="604" cy="104" r="4" fill="#71717A">
      <animate attributeName="opacity" values="1;0.35;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="822" cy="160" r="4" fill="#A1A1AA">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="210" r="4" fill="#71717A"/>
    <circle cx="892" cy="206" r="4" fill="#A1A1AA"/>
  </g>
  <g mask="url(#fade)" opacity="0.18">
    <rect x="-220" y="0" width="180" height="360" fill="#F4F4F5">
      <animate attributeName="x" from="-220" to="1320" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#softShadow)">
    <text x="640" y="145" text-anchor="middle" fill="url(#metal)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="7">FELIPE CORDEIRO</text>
    <text x="640" y="202" text-anchor="middle" fill="#D4D4D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="1.2">Building Digital Products</text>
    <text x="640" y="238" text-anchor="middle" fill="#A1A1AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1">Automation Systems</text>
    <text x="640" y="270" text-anchor="middle" fill="#A1A1AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1">Analytics Platforms</text>
  </g>

  <path d="M438 303H842" stroke="#3F3F46" stroke-width="1"/>
  <path d="M522 303H758" stroke="#A1A1AA" stroke-width="1.5" opacity="0.72">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
