<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Felipe Cordeiro software engineering banner">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.52" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="textMetal" x1="360" y1="0" x2="920" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8A8A"/>
      <stop offset="0.45" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#A0A0A0"/>
    </linearGradient>
    <pattern id="technicalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#2A2A2A" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9D9D9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#D9D9D9" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#D9D9D9" stop-opacity="0.25"/>
      <stop offset="0.82" stop-color="#D9D9D9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D9D9D9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#surface)"/>
  <rect x="1" y="1" width="1278" height="358" rx="23" stroke="#2A2A2A" stroke-width="1.5"/>
  <rect width="1280" height="360" fill="url(#technicalGrid)" opacity="0.62"/>

  <g opacity="0.28" stroke="#D9D9D9" stroke-width="1" stroke-linecap="round">
    <path d="M64 82H254L302 118H430M850 118H978L1026 82H1216" stroke-dasharray="34 24">
      <animate attributeName="stroke-dashoffset" from="0" to="-232" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M94 274H282L336 238H452M828 238H944L998 274H1186" stroke-dasharray="28 22">
      <animate attributeName="stroke-dashoffset" from="0" to="220" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M142 44V146M232 210V316M1048 44V146M1138 210V316" stroke-dasharray="22 20">
      <animate attributeName="stroke-dashoffset" from="0" to="-168" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 180H216M1064 180H1280" stroke-dasharray="42 32">
      <animate attributeName="stroke-dashoffset" from="0" to="-296" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.18" stroke="#8A8A8A" stroke-width="1">
    <path d="M70 132H160V172H248" />
    <path d="M1032 132H1120V172H1210" />
    <path d="M82 224H182V196H264" />
    <path d="M1016 224H1116V196H1198" />
  </g>

  <g opacity="0.36">
    <circle cx="302" cy="118" r="3" fill="#D9D9D9">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="978" cy="118" r="3" fill="#D9D9D9">
      <animate attributeName="opacity" values="0.65;0.2;0.65" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="336" cy="238" r="3" fill="#8A8A8A"/>
    <circle cx="944" cy="238" r="3" fill="#8A8A8A"/>
  </g>

  <path d="M250 316H1030" stroke="url(#lineFade)" stroke-width="1"/>
  <path d="M430 50H850" stroke="url(#lineFade)" stroke-width="1" opacity="0.45"/>

  <g filter="url(#depth)">
    <text x="640" y="144" text-anchor="middle" fill="url(#textMetal)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="8">FELIPE CORDEIRO</text>
    <text x="640" y="204" text-anchor="middle" fill="#D9D9D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="0.8">Turning Business Problems Into Software</text>
    <text x="640" y="244" text-anchor="middle" fill="#8A8A8A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="1.4">Software • Automation • Analytics</text>
  </g>

  <g opacity="0.16">
    <rect x="456" y="276" width="368" height="1" fill="#D9D9D9">
      <animate attributeName="opacity" values="0.08;0.28;0.08" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="286" width="160" height="1" fill="#D9D9D9">
      <animate attributeName="x" values="520;600;520" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
