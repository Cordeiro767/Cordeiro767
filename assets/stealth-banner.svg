    </path>
    <path d="M830 244H954L1012 292H1200" stroke="url(#flow)" stroke-width="1.6" stroke-dasharray="120 520" opacity="0.54">
      <animate attributeName="stroke-dashoffset" from="0" to="-640" dur="7.8s" repeatCount="indefinite"/>
    </path>
    <path d="M136 48V142L188 184V326" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="92 430" opacity="0.32">
