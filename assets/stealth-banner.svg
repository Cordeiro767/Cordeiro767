<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Felipe Cordeiro Python Developer Automacao Bots Projetos Reais">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 172) rotate(90) scale(210 620)">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="0.52" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="370" y1="90" x2="910" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FDFF"/>
      <stop offset="0.52" stop-color="#DFF9FF"/>
      <stop offset="1" stop-color="#8BE9F9"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="0.62" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
