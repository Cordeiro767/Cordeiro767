  <rect width="1280" height="380" fill="url(#grid)" opacity="0.32"/>
  <rect x="1" y="1" width="1278" height="378" rx="27" stroke="#243241" stroke-width="1.2"/>

  <g opacity="0.28" stroke="#243241" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
